<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mind Atlas is a 2.5D spatial notebook for navigating parallel AI-assisted work."
    />
    <meta name="theme-color" content="#061014" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Mind Atlas</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1") {
        const originalInfo = console.info;
        console.info = (...args) => {
          if (
            typeof args[0] === "string" &&
            args[0].includes("Download the React DevTools for a better development experience")
          ) {
            return;
          }
          originalInfo(...args);
        };
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
