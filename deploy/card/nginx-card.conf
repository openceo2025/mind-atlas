# Mind Atlas (Cards) — card.mind-atlas.org → 127.0.0.1:8789 (the old beta.mind-atlas.org site proxies to the same port)
#
# Installed once as /etc/nginx/sites-available/mind-atlas-card. certbot --nginx then adds the
# 443 listener and the HTTP→HTTPS redirect to this file, so redeploys never overwrite it.
#
# The server-level access_log replaces the http-level logs from conf.d, including
# mind-atlas-analytics.log, so card traffic never reaches the main analytics.

limit_req_zone $binary_remote_addr zone=mind_atlas_card_general:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=mind_atlas_card_api:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=mind_atlas_card_auth:10m rate=10r/m;

server {
    listen 80;
    server_name card.mind-atlas.org;

    access_log /var/log/nginx/mind-atlas-card.access.log;
    error_log /var/log/nginx/mind-atlas-card.error.log;

    client_max_body_size 30m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self), payment=(self)" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/auth/ {
        limit_req zone=mind_atlas_card_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        limit_req zone=mind_atlas_card_api burst=120 nodelay;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        limit_req zone=mind_atlas_card_general burst=240 nodelay;
        proxy_pass http://127.0.0.1:8789;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
