map $http_referer $mind_atlas_referrer_host {
    default "";
    ~^https?://(?<analytics_referrer_host>[^/:?#]+) $analytics_referrer_host;
}

log_format mind_atlas_analytics escape=json
  '{"time":"$time_iso8601",'
  '"ip":"$remote_addr",'
  '"uri":"$uri",'
  '"status":$status,'
  '"referrer_host":"$mind_atlas_referrer_host",'
  '"utm_source":"$arg_utm_source",'
  '"utm_medium":"$arg_utm_medium",'
  '"utm_campaign":"$arg_utm_campaign",'
  '"accept_language":"$http_accept_language",'
  '"user_agent":"$http_user_agent",'
  '"admin":"$cookie_ma_admin_traffic",'
  '"request_time":$request_time}';
