<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>MindAtlas promo — encoder</title>
</head>
<body style="background:#000;color:#9cf;font:14px monospace">
<pre id="log">encoder ready</pre>
<script type="module">
// 撮った絵と音を、Chrome 自身の H.264 / AAC 符号器（WebCodecs）で圧縮して MP4 にする
import { buildMp4 } from './lib/mp4.js';

const log = (s) => { document.getElementById('log').textContent += `\n${s}`; console.log(s); };

/** 動画の時刻 t に映す絵（その時刻までで最新のもの） */
function planFrames(tl) {
  const total = Math.round(tl.duration * tl.fps);
  const plan = [];
  let offset = 0;
  let si = 0;
  let fi = 0;
  for (let i = 0; i < total; i++) {
    const t = i / tl.fps;
    while (si < tl.segments.length - 1 && t >= offset + (tl.segments[si].end - tl.segments[si].start)) {
      offset += tl.segments[si].end - tl.segments[si].start;
      si += 1;
      fi = 0;
    }
    const s = tl.segments[si];
    const wall = s.start + (t - offset);
    while (fi + 1 < s.frames.length && s.frames[fi + 1].at <= wall) fi += 1;
    plan.push({ file: `frames/${s.frames[fi].file}`, segment: s.name, t });
  }
  return plan;
}

async function pickCodec(width, height) {
  // B フレームを作らないソフトウェア符号器（OpenH264）を優先する
  const tries = [
    { codec: 'avc1.42e028', hardwareAcceleration: 'prefer-software' },
    { codec: 'avc1.4d0028', hardwareAcceleration: 'prefer-software' },
    { codec: 'avc1.640028', hardwareAcceleration: 'no-preference' },
  ];
  for (const t of tries) {
    const config = { ...t, width, height, bitrate: 14_000_000, framerate: 30, avc: { format: 'avc' }, latencyMode: 'quality' };
    if ((await VideoEncoder.isConfigSupported(config)).supported) return config;
  }
  throw new Error('no H.264 encoder');
}

function readWav(buf) {
  const view = new DataView(buf);
  let at = 12;
  let fmt = null;
  while (at < view.byteLength) {
    const id = String.fromCharCode(...new Uint8Array(buf, at, 4));
    const size = view.getUint32(at + 4, true);
    if (id === 'fmt ') fmt = { channels: view.getUint16(at + 10, true), rate: view.getUint32(at + 12, true), bits: view.getUint16(at + 22, true) };
    if (id === 'data') {
      const frames = size / (fmt.channels * 2);
      const planes = Array.from({ length: fmt.channels }, () => new Float32Array(frames));
      for (let i = 0; i < frames; i++) for (let c = 0; c < fmt.channels; c++) planes[c][i] = view.getInt16(at + 8 + (i * fmt.channels + c) * 2, true) / 32768;
      return { ...fmt, planes };
    }
    at += 8 + size + (size % 2);
  }
  throw new Error('bad wav');
}

const bitmapOf = async (url) => createImageBitmap(await (await fetch(url)).blob());

const clamp01 = (v) => Math.max(0, Math.min(1, v));

/** 字幕の切り替わり：いまの字幕と、ひとつ前の字幕（消えていく方） */
function captionState(events, t) {
  let cur = { t: -1, img: null };
  let prev = cur;
  for (const e of events) { if (e.t > t) break; prev = cur; cur = e; }
  return { cur, prev };
}

/** 横版：録画の上に字幕を重ねる（ふわっと浮かんで出て、すっと消える） */
async function landscapePainter(tl, { captions }) {
  const imgs = await Promise.all(captions.map((_, i) => bitmapOf(`out/landscape/caption-${i}.png`)));
  const events = tl.events.filter((e) => e.kind === 'caption').map((e) => ({ t: e.t, img: e.data ? imgs[captions.indexOf(e.data.ja)] : null }));
  return (ctx, bitmap, step) => {
    ctx.fillStyle = '#040b1a';
    ctx.fillRect(0, 0, tl.width, tl.height);
    ctx.drawImage(bitmap, 0, 0, tl.width, tl.height);
    if (!step.segment.startsWith('app')) return;
    const { cur, prev } = captionState(events, step.t);
    const p = clamp01((step.t - cur.t) / 0.45);
    if (prev.img && p < 1) { ctx.globalAlpha = 1 - p; ctx.drawImage(prev.img, 0, 0); }
    if (cur.img) { const k = 1 - Math.pow(1 - p, 3); ctx.globalAlpha = p; ctx.drawImage(cur.img, 0, Math.round((1 - k) * 36)); }
    ctx.globalAlpha = 1;
  };
}

/**
 * 縦版：真ん中の窓に、いま大事な場所（カーソル・窓・操作の輪・選んだカード・範囲選択）が
 * 全部入るように切り出す。入らないときは少し引いて（最大 0.83 倍まで）収める。
 * 動きは先の出来事も見て決めるので、操作の瞬間に遅れて追いかけることがない。
 */
async function verticalPainter(tl, { window: win, captions }) {
  const plain = await bitmapOf('out/vertical/plain.png');
  const none = await bitmapOf('out/vertical/chrome-none.png');
  const chrome = await Promise.all(captions.map((_, i) => bitmapOf(`out/vertical/chrome-${i}.png`)));
  const capEvents = tl.events.filter((e) => e.kind === 'caption').map((e) => ({ t: e.t, img: e.data ? chrome[captions.indexOf(e.data.ja)] ?? none : none }));
  const roi = tl.events.filter((e) => e.kind === 'roi').map((e) => ({ t: e.t, boxes: e.data.map(([x, y, w, h, kind]) => ({ x: x * 1.5, y: y * 1.5, w: w * 1.5, h: h * 1.5, kind })) }));
  const aspect = 1080 / win.h;
  const maxW = Math.min(1920, 1080 * aspect); // 切り出しの高さは録画の高さ（1080）まで
  const PAD = 56;

  const union = (boxes) => {
    if (!boxes.length) return null;
    const x1 = Math.min(...boxes.map((b) => b.x)) - PAD;
    const y1 = Math.min(...boxes.map((b) => b.y)) - PAD;
    const x2 = Math.max(...boxes.map((b) => b.x + b.w)) + PAD;
    const y2 = Math.max(...boxes.map((b) => b.y + b.h)) + PAD;
    return { cx: (x1 + x2) / 2, cy: (y1 + y2) / 2, w: Math.max(1080, x2 - x1, (y2 - y1) * aspect) };
  };
  // 入りきらないときは、選んだカード → 窓 の順にあきらめ、手元（カーソル・輪・範囲選択）を優先する
  const need = (boxes) => {
    const tries = [boxes, boxes.filter((b) => b.kind !== 'card'), boxes.filter((b) => b.kind !== 'card' && b.kind !== 'window')];
    for (const set of tries) { const u = union(set); if (u && u.w <= maxW) return u; }
    const u = union(tries[2]) ?? union(boxes);
    return u ? { ...u, w: maxW } : null;
  };

  // 先に、アプリの部分の全コマについて「映したい所」を出しておく
  const frames = Math.round(tl.duration * tl.fps);
  const want = new Array(frames).fill(null);
  let ri = 0;
  let last = { cx: 960, cy: 540, w: 1080 };
  for (let i = 0; i < frames; i++) {
    const t = i / tl.fps;
    while (ri + 1 < roi.length && roi[ri + 1].t <= t) ri++;
    if (!roi.length || roi[ri].t > t + 0.2) continue;
    last = need(roi[ri].boxes) ?? last;
    want[i] = last;
  }
  // 先回り：少し先（0.6 秒）までに必要になる広さを今から取り、中心は少し先の平均に寄せる
  const LEAD = Math.round(0.6 * tl.fps);
  const plan = want.map((w, i) => {
    if (!w) return null;
    let W = w.w, cx = 0, cy = 0, n = 0;
    for (let j = Math.max(0, i - 4); j <= Math.min(frames - 1, i + LEAD); j++) {
      const v = want[j];
      if (!v) continue;
      W = Math.max(W, v.w);
      if (j >= i) { cx += v.cx; cy += v.cy; n += 1; }
    }
    return { cx: cx / n, cy: cy / n, w: W };
  });
  // ぶれないよう前後になだらかにする（遅れの出ない、前から後ろからの二度がけ）
  const smooth = (key, k) => {
    let v = null;
    for (let i = 0; i < frames; i++) { if (!plan[i]) { v = null; continue; } v = v === null ? plan[i][key] : v + (plan[i][key] - v) * k; plan[i][key] = v; }
    v = null;
    for (let i = frames - 1; i >= 0; i--) { if (!plan[i]) { v = null; continue; } v = v === null ? plan[i][key] : v + (plan[i][key] - v) * k; plan[i][key] = v; }
  };
  smooth('cx', 0.12);
  smooth('cy', 0.12);
  smooth('w', 0.1);

  return (ctx, bitmap, step) => {
    if (step.segment === 'intro') {
      // 導入は縦向きに撮ってあるので、そのまま
      ctx.drawImage(bitmap, 0, 0, 1080, 1920);
      return;
    }
    if (!step.segment.startsWith('app')) {
      // 冒頭と締め：中央を正方形で切り出して、上下は背景へなじませる
      ctx.drawImage(plain, 0, 0);
      ctx.drawImage(bitmap, 420, 0, 1080, 1080, 0, 420, 1080, 1080);
      for (const [y0, y1] of [[420, 560], [1500, 1360]]) {
        const g = ctx.createLinearGradient(0, y0, 0, y1);
        g.addColorStop(0, '#040b1a');
        g.addColorStop(1, 'rgba(4,11,26,0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, Math.min(y0, y1), 1080, Math.abs(y1 - y0));
      }
      return;
    }
    const i = Math.min(frames - 1, Math.round(step.t * tl.fps));
    const cam = plan[i] ?? { cx: 960, cy: 540, w: 1080 };
    const cw = Math.max(1080, Math.min(maxW, cam.w));
    const ch = cw / aspect;
    const x0 = Math.max(0, Math.min(1920 - cw, cam.cx - cw / 2));
    const y0 = Math.max(0, Math.min(1080 - ch, cam.cy - ch / 2));
    ctx.fillStyle = '#040b1a';
    ctx.fillRect(0, win.y, 1080, win.h);
    ctx.drawImage(bitmap, x0, y0, cw, ch, 0, win.y, 1080, win.h);
    const { cur, prev } = captionState(capEvents, step.t);
    const p = clamp01((step.t - cur.t) / 0.35);
    ctx.drawImage(p < 1 ? prev.img ?? none : cur.img ?? none, 0, 0);
    if (p < 1) { ctx.globalAlpha = p; ctx.drawImage(cur.img ?? none, 0, 0); ctx.globalAlpha = 1; }
  };
}

window.runEncode = async ({ name, layout = 'landscape', edit = null, audio: audioFile = 'out/music.wav', ...options }) => {
  const tl = await (await fetch('out/timeline.json')).json();
  const vertical = layout === 'vertical';
  const W = vertical ? 1080 : tl.width;
  const H = vertical ? 1920 : tl.height;
  // 編集版（edit.mjs の結果）があれば、その並びどおりに絵を置く。t は元の録画の時刻
  const cut = edit ? await (await fetch(edit)).json() : null;
  const plan = cut ? cut.frames.map((f) => ({ file: f.file, segment: f.kind, t: f.t })) : planFrames(tl);
  const duration = cut ? cut.duration : tl.duration;
  const paint = vertical ? await verticalPainter(tl, options) : await landscapePainter(tl, options);
  log(`frames: ${plan.length} (${duration}s @ ${tl.fps}fps)`);

  // ── 映像 ──
  const config = await pickCodec(W, H);
  log(`video: ${config.codec} ${config.hardwareAcceleration}`);
  const vSamples = [];
  let avcC = null;
  let lastTs = -1;
  let reordered = false;
  const venc = new VideoEncoder({
    output: (chunk, meta) => {
      if (meta?.decoderConfig?.description) avcC = new Uint8Array(meta.decoderConfig.description);
      if (chunk.timestamp <= lastTs) reordered = true;
      lastTs = chunk.timestamp;
      const data = new Uint8Array(chunk.byteLength);
      chunk.copyTo(data);
      vSamples.push({ data, key: chunk.type === 'key' });
    },
    error: (e) => log(`video error: ${e.message}`),
  });
  venc.configure(config);
  const canvas = new OffscreenCanvas(W, H);
  const ctx = canvas.getContext('2d');
  let current = '';
  let bitmap = null;
  for (let i = 0; i < plan.length; i++) {
    if (plan[i].file !== current) {
      current = plan[i].file;
      bitmap?.close();
      bitmap = await bitmapOf(`out/${current}`);
    }
    paint(ctx, bitmap, plan[i]);
    const frame = new VideoFrame(canvas, { timestamp: Math.round((i * 1e6) / tl.fps), duration: Math.round(1e6 / tl.fps) });
    venc.encode(frame, { keyFrame: i % (tl.fps * 2) === 0 });
    frame.close();
    while (venc.encodeQueueSize > 4) await new Promise((r) => setTimeout(r, 1));
    if (i % 150 === 0) log(`  video ${i}/${plan.length}`);
  }
  await venc.flush();
  venc.close();
  if (reordered) throw new Error('encoder produced reordered frames (B-frames); container would need ctts');
  log(`video done: ${vSamples.length} samples, ${(vSamples.reduce((a, s) => a + s.data.length, 0) / 1e6).toFixed(1)} MB`);

  // ── 音 ──
  let audio = null;
  try {
    const wav = readWav(await (await fetch(audioFile)).arrayBuffer());
    const need = Math.round(duration * wav.rate);
    const planes = wav.planes.map((p) => { const q = new Float32Array(need); q.set(p.subarray(0, need)); return q; });
    const aSamples = [];
    let asc = null;
    const aenc = new AudioEncoder({
      output: (chunk, meta) => {
        if (meta?.decoderConfig?.description) asc = new Uint8Array(meta.decoderConfig.description);
        const data = new Uint8Array(chunk.byteLength);
        chunk.copyTo(data);
        aSamples.push({ data });
      },
      error: (e) => log(`audio error: ${e.message}`),
    });
    const bitrate = 192_000;
    aenc.configure({ codec: 'mp4a.40.2', sampleRate: wav.rate, numberOfChannels: wav.channels, bitrate });
    const block = 1024 * 16;
    for (let at = 0; at < need; at += block) {
      const n = Math.min(block, need - at);
      const data = new Float32Array(n * wav.channels);
      for (let c = 0; c < wav.channels; c++) data.set(planes[c].subarray(at, at + n), c * n);
      const audioData = new AudioData({ format: 'f32-planar', sampleRate: wav.rate, numberOfFrames: n, numberOfChannels: wav.channels, timestamp: Math.round((at / wav.rate) * 1e6), data });
      aenc.encode(audioData);
      audioData.close();
    }
    await aenc.flush();
    aenc.close();
    if (!asc) throw new Error('no AudioSpecificConfig');
    audio = { sampleRate: wav.rate, channels: wav.channels, asc, samples: aSamples, frameSize: 1024, bitrate };
    log(`audio done: ${aSamples.length} AAC frames`);
  } catch (error) {
    log(`audio skipped: ${error.message}`);
  }

  // ── 詰めて、保存して、確かめる ──
  const mp4 = buildMp4({ video: { width: W, height: H, fps: tl.fps, avcC, samples: vSamples }, audio });
  const saved = await fetch(`/save?name=${encodeURIComponent(name)}`, { method: 'POST', body: mp4 });
  if (!saved.ok) throw new Error(`save failed: ${saved.status}`);
  log(`saved ${name}: ${(mp4.length / 1e6).toFixed(1)} MB`);

  const video = document.createElement('video');
  video.muted = true;
  video.src = URL.createObjectURL(new Blob([mp4], { type: 'video/mp4' }));
  await new Promise((resolve, reject) => { video.onloadedmetadata = resolve; video.onerror = () => reject(new Error('the MP4 does not load')); });
  const probe = [];
  for (const t of [1, duration / 2, duration - 1]) {
    video.currentTime = t;
    await new Promise((resolve) => { video.onseeked = resolve; });
    const c = new OffscreenCanvas(64, 36);
    const g = c.getContext('2d');
    g.drawImage(video, 0, 0, 64, 36);
    const px = g.getImageData(0, 0, 64, 36).data;
    let sum = 0;
    for (let i = 0; i < px.length; i += 4) sum += px[i] + px[i + 1] + px[i + 2];
    probe.push({ t: Number(t.toFixed(1)), brightness: Math.round(sum / (px.length / 4) / 3) });
  }
  return { bytes: mp4.length, duration: video.duration, width: video.videoWidth, height: video.videoHeight, codec: config.codec, audio: Boolean(audio), probe };
};
</script>
</body>
</html>
