<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mind Atlasの触れるサンプル。小説、旅行計画、アプリ開発の宇宙をスクロールして確認できます。"
    />
    <meta name="theme-color" content="#07100d" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Mind Atlas</title>
    <style>
      :root {
        --bg: #07100d;
        --text: #f5fbef;
        --muted: rgba(245, 251, 239, 0.72);
        --line: rgba(245, 251, 239, 0.16);
        --lime: #d8f56d;
        --mint: #78dfbb;
        --panel: rgba(7, 16, 13, 0.78);
        --shadow: 0 22px 72px rgba(0, 0, 0, 0.34);
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        scroll-behavior: smooth;
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100%;
        background:
          linear-gradient(rgba(245, 251, 239, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(245, 251, 239, 0.02) 1px, transparent 1px),
          radial-gradient(circle at 50% -14rem, rgba(120, 223, 187, 0.16), transparent 36rem),
          #07100d;
        background-size: 34px 34px, 34px 34px, auto, auto;
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        letter-spacing: 0;
      }

      button,
      a {
        color: inherit;
        font: inherit;
        letter-spacing: 0;
      }

      .shell {
        width: min(1080px, calc(100% - 20px));
        margin: 0 auto;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        background: rgba(7, 16, 13, 0.88);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        font-weight: 900;
      }

      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 7px;
      }

      .cta {
        display: inline-flex;
        min-height: 38px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(216, 245, 109, 0.62);
        border-radius: 8px;
        padding: 9px 13px;
        background: var(--lime);
        color: #10180c;
        text-decoration: none;
        font-size: 13px;
        font-weight: 900;
        white-space: nowrap;
      }

      .hero {
        padding: 16px 0 8px;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0;
        font-size: clamp(52px, 17vw, 112px);
        line-height: 0.92;
      }

      .example {
        display: grid;
        gap: 12px;
        padding: 10px 0 54px;
      }

      h2 {
        margin-bottom: 0;
        font-size: clamp(28px, 8vw, 56px);
        line-height: 1.05;
      }

      .view-controls {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0 4px;
        scrollbar-width: none;
      }

      .view-controls::-webkit-scrollbar {
        display: none;
      }

      .view-controls button {
        flex: 0 0 auto;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 12px;
        background: rgba(245, 251, 239, 0.055);
        color: var(--text);
        cursor: pointer;
        font-size: 13px;
        font-weight: 850;
      }

      .view-controls button[aria-pressed="true"] {
        border-color: rgba(216, 245, 109, 0.66);
        background: rgba(216, 245, 109, 0.15);
        color: #f9ffe0;
      }

      .demo-window {
        position: relative;
        min-height: 520px;
        height: min(720px, 78svh);
        overflow: hidden;
        border: 1px solid rgba(245, 251, 239, 0.17);
        border-radius: 8px;
        background: #050706;
        box-shadow: var(--shadow);
      }

      .demo-window iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #050706;
      }

      .demo-label {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        border: 1px solid rgba(245, 251, 239, 0.14);
        border-radius: 999px;
        padding: 6px 9px;
        background: rgba(7, 16, 13, 0.72);
        color: rgba(245, 251, 239, 0.72);
        font-size: 11px;
        font-weight: 850;
        pointer-events: none;
      }

      .app-note,
      .final-cta p {
        max-width: 720px;
        margin-bottom: 0;
        color: var(--muted);
        font-size: 16px;
        font-weight: 700;
        line-height: 1.55;
      }

      .final-cta {
        display: grid;
        gap: 16px;
        min-height: 58svh;
        align-content: center;
        justify-items: start;
        padding: 10px 0 72px;
      }

      @media (min-width: 820px) {
        .shell {
          width: min(1120px, calc(100% - 48px));
        }

        .topbar {
          padding: 14px 0;
        }

        .hero {
          padding-top: 30px;
        }

        .example {
          padding-bottom: 72px;
        }

        .demo-window {
          min-height: 620px;
          height: min(780px, 74svh);
        }
      }

      @media (max-width: 520px) {
        .brand span {
          display: none;
        }

        .shell {
          width: min(100% - 14px, 520px);
        }

        .topbar {
          padding: 8px 0;
        }

        .cta {
          min-height: 36px;
          padding: 8px 12px;
        }

        h1 {
          font-size: clamp(56px, 19vw, 88px);
        }

        .demo-window {
          min-height: 560px;
          height: 76svh;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Open Mind Atlas">
          <img src="/favicon.svg" alt="" />
          <span>MIND ATLAS</span>
        </a>
        <a class="cta" href="/">Mind Atlasを使ってみる</a>
      </header>

      <main>
        <section class="hero" aria-labelledby="page-title">
          <h1 id="page-title">Mind Atlas</h1>
        </section>

        <section class="example" aria-labelledby="novel-title">
          <h2 id="novel-title">Mind Atlasで小説を書く</h2>
          <div class="view-controls" role="group" aria-label="Novel demo views">
            <button type="button" data-demo-view="atlas" aria-pressed="true">Mind Atlas</button>
            <button type="button" data-demo-view="mind-map" aria-pressed="false">MindMap</button>
            <button type="button" data-demo-view="tree" aria-pressed="false">Tree</button>
            <button type="button" data-demo-view="editor" aria-pressed="false">Editor</button>
          </div>
          <div class="demo-window">
            <span class="demo-label">embedded Mind Atlas</span>
            <iframe
              id="novel-frame"
              title="Mind Atlas novel example"
              src="/?aboutDemo=novel&amp;aboutView=atlas"
              allow="fullscreen"
            ></iframe>
          </div>
        </section>

        <section class="example" aria-labelledby="travel-title">
          <h2 id="travel-title">旅行計画を忘れない</h2>
          <div class="demo-window">
            <span class="demo-label">notification demo</span>
            <iframe
              title="Mind Atlas travel planning example"
              src="/?aboutDemo=travel&amp;aboutView=atlas"
              loading="lazy"
              allow="fullscreen"
            ></iframe>
          </div>
        </section>

        <section class="example" aria-labelledby="app-title">
          <h2 id="app-title">AI相談を開発ノードに残す</h2>
          <p class="app-note">Googleアカウント登録と月$10のMind Atlas ProプランでAI機能が解放されます。</p>
          <div class="demo-window">
            <span class="demo-label">AI window demo</span>
            <iframe
              title="Mind Atlas app development AI example"
              src="/?aboutDemo=app&amp;aboutView=atlas"
              loading="lazy"
              allow="fullscreen"
            ></iframe>
          </div>
        </section>

        <section class="final-cta" aria-labelledby="cta-title">
          <h2 id="cta-title">MindAtlasを使ってみる</h2>
          <p>ログインなしで基本機能は使えます。Mind Atlas Proプランに登録するとAI機能が解放されます。</p>
          <a class="cta" href="/">MindAtlasに飛び込もう</a>
        </section>
      </main>
    </div>

    <script>
      const novelFrame = document.getElementById("novel-frame");
      const viewButtons = Array.from(document.querySelectorAll("[data-demo-view]"));
      const demoFrames = () => Array.from(document.querySelectorAll(".demo-window iframe"));
      viewButtons.forEach((button) => {
        button.addEventListener("click", () => {
          const view = button.getAttribute("data-demo-view") || "atlas";
          viewButtons.forEach((item) => item.setAttribute("aria-pressed", item === button ? "true" : "false"));
          novelFrame.src = `/?aboutDemo=novel&aboutView=${encodeURIComponent(view)}`;
        });
      });
      window.addEventListener("message", (event) => {
        if (!event.data || event.data.type !== "mind-atlas-about-scroll") return;
        if (!demoFrames().some((frame) => frame.contentWindow === event.source)) return;
        const deltaY = Number(event.data.deltaY);
        if (!Number.isFinite(deltaY) || Math.abs(deltaY) < 0.5) return;
        window.scrollBy({ top: deltaY, left: 0, behavior: "auto" });
      });
    </script>
  </body>
</html>
