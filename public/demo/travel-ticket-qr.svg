  </g>
  <g fill="#172015">
    <text x="92" y="110" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" letter-spacing="2">TRAVEL PASS</text>
    <text x="92" y="150" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900">MIND ATLAS</text>
    <text x="94" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" opacity="0.72">Sample itinerary ticket</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172015">
    <text x="96" y="250" font-size="15" font-weight="800" opacity="0.58">DATE</text>
