    <text x="238" y="250" font-size="15" font-weight="800" opacity="0.58">SEAT</text>
    <text x="238" y="280" font-size="28" font-weight="900">A-12</text>
    <text x="352" y="250" font-size="15" font-weight="800" opacity="0.58">GATE</text>
    <text x="352" y="280" font-size="28" font-weight="900">03</text>
    <text x="96" y="344" font-size="15" font-weight="800" opacity="0.58">TICKET NO.</text>
    <text x="96" y="374" font-size="31" font-weight="900" letter-spacing="1">MA-527312</text>
  </g>
  <rect x="494" y="92" width="132" height="132" rx="12" fill="#fff" stroke="#172015" stroke-width="8"/>
  <image x="506" y="104" width="108" height="108" image-rendering="pixelated" href="data:image/png;base64,"/>
  <g fill="#172015" font-family="Arial, Helvetica, sans-serif">
