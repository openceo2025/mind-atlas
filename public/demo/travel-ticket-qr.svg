<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480" role="img" aria-label="Travel ticket QR code sample">
  <defs>
    <linearGradient id="ticket-bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7dd"/>
      <stop offset="1" stop-color="#f4d989"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2c2306" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="720" height="480" rx="42" fill="#11231d"/>
  <g filter="url(#soft-shadow)">
    <path d="M72 58h576a24 24 0 0 1 24 24v316a24 24 0 0 1-24 24H72a24 24 0 0 1-24-24v-70a32 32 0 0 0 0-64v-48a32 32 0 0 0 0-64V82a24 24 0 0 1 24-24Z" fill="url(#ticket-bg)"/>
